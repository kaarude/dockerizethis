name: Bug report
description: Report a problem with dockerize.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in as much as you can, and remove any secrets from logs before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior you saw.
      placeholder: dockerize wrote a Dockerfile that fails to build because ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dockerize ./my-app`
        2. Open the generated Dockerfile
        3. Run `docker build .`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dockerize version
      description: The release tag or commit you built from.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: CLI output, Docker build errors, or generated files. Remove secrets first.
      render: shell
    validations:
      required: false
