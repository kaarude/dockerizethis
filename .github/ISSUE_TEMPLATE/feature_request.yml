name: Feature request
description: Suggest a new stack, artifact, or behavior.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that is painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should dockerize do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false
  - type: dropdown
    id: stack
    attributes:
      label: Related stack
      options:
        - Node.js / TypeScript
        - Go
        - Python
        - Static site
        - Other
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, or screenshots.
    validations:
      required: false
