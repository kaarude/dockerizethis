name: Docker build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    name: list fixtures
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          fixtures=$(find testdata/fixtures -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R . | jq -cs)
          echo "matrix=$fixtures" >> "$GITHUB_OUTPUT"

  build:
    name: verify (${{ matrix.fixture }})
    needs: fixtures
    if: needs.fixtures.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(needs.fixtures.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build dockerizethis
        run: go build -o dockerizethis ./cmd/dockerizethis
        env:
          GOTOOLCHAIN: auto
      - name: Generate artifacts and verify the image build
        run: |
          work=$(mktemp -d)
          cp -R "testdata/fixtures/${{ matrix.fixture }}/." "$work/"
          ./dockerizethis --yes --verify=build "$work"
        env:
          GOTOOLCHAIN: auto
