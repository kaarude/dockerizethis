version: 2

project_name: dockerizethis

before:
  hooks:
    - go mod download

builds:
  - id: dockerizethis
    main: ./cmd/dockerize
    binary: dockerize
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s
      - -w

archives:
  - id: dockerizethis
    ids:
      - dockerizethis
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kaarude
    name: dockerizethis
  draft: false
  prerelease: auto
